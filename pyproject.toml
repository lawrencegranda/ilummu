[tool.poetry]
name = "edify"
version = "0.1.0"
description = ""
authors = ["Lawrence Granda Zarzuela <lawrencegranda@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10 <3.11"
bcrypt = "4.0.1"
email-validator = "1.3.1"
flask-apispec = "0.11.4"
flask-bcrypt = "1.0.1"
flask-cors = "3.0.10"
flask-httpauth = "4.7.0"
flask-login = "0.6.2"
flask-mail = "^0.10.0"
flask-reqparse = "2.2.1"
flask-restful = "0.3.9"
flask-sqlalchemy = "3.0.3"
flask-wtf = "1.1.1"
itsdangerous = "2.1.2"
jinja2 = "3.1.2"
sqlalchemy = "2.0.4"
typing-extensions = "4.5.0"
flask-jwt-extended = "4.4.4"
flask = "2.2.3"
werkzeug = "2.2.2"
faker = "^25.9.2"
pymysql = "^1.1.1"
flask-migrate = "^4.0.7"
mysql-connector = "^2.2.9"
phonenumbers = "^8.13.40"
djlint = "^1.34.1"
pytest = "^8.3.2"
psycopg2-binary = "^2.9.9"
gunicorn = "^23.0.0"
boto3 = "^1.35.54"
pillow = "^11.0.0"
flask-socketio = "^5.5.1"
pylint = "^3.3.3"
PyJWT = ">=2.0,<2.10"
cloc = "^0.2.5"
black = "^25.1.0"
gevent = "^24.11.1"
greenlet = "^3.1.1"google-auth = "^2.37.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"
flask-oauthlib = "^0.9.6"
flask-session = "^0.8.0"
requests = "^2.32.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.pylint.MASTER]
ignore-paths = [
    "^migrations/.*$",
    "^.*/migrations/.*$",
    "^.*/conftest.py$",
    "^.venv/.*$",
    "^.*/\\.venv/.*$"
]

[tool.djlint]
blank_line_after_tag="endblock,endfor,endif"
blank_line_before_tag="block,for,if"
line_break_after_multiline_tag=true
use_gitignore=true
ignore="H023,H021,H014"
format_css=true
format_js=false
indent=4
max_line_length=120
profile="jinja"
max_attribute_length=80
format_attributes="multi-line"
format_attribute_template_tags=true
close_void_tags=true
max_blank_lines=1
extension=".jinja"