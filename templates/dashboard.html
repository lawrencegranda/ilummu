<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edify Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <!-- Main CSS file -->
    <link rel="stylesheet" type="text/css" href="static/styles/styles.css">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="navbar">
      <div class="container navigation">
        <div class="navigation-left">
          <a class="brand" href="/">
            <img class="image" src="https://assets-global.website-files.com/663e9d09bf17aecd0f01533c/663e9dd579b2ea25fbccac21_graduation-cap-svgrepo-com.svg" alt="" width="67" />
          </a>
          <div class="brand-name"> Edify </div>
        </div>
        <div class="navigation-center">
          <input type="text" id="search-box" placeholder="Search for a question..." name="text" class="form-control" autocomplete="off">
        </div>
        <div class="navigation-right">
          <div class="navigation-button-wrap">
            <button class="btn btn-dark" type="button">Log Out</button>
          </div>
        </div>
      </div>
    </div>
    <button class="btn add-button" type="button">
      <img class="plus-add" src="static/plus.svg" alt="" />
    </button>
    <div class="container main-content">
      <div class="dashboard-container">
        <div class="dashboard-menu-container">
          <div class="dashboard-menu">
            <button class="btn category all-majors">All Majors</button>
            <button class="btn category">Mathematics</button>
            <button class="btn category">Computer Science</button>
            <button class="btn category">Engineering</button>
            <button class="btn category">Biology</button>
            <button class="btn category">Chemistry</button>
            <button class="btn category">AEM</button>
            <button class="btn category">Economics</button>
            <button class="btn category">Other</button>
          </div>
        </div>
        <div class="grid">
          <div class="element-box unsolved">
            <div class="element-content-wrapper">
              <div class="element-content">
                <p class="question-preview-class">AEM 2200: Business Man and Org</p>
                <p class="question-preview-solve-time">~5 min solve time</p>
                <p class="question-preview-description">
                  How do I create a SWOT analysis?
                </p>
              </div>
              <div class="question-preview-side">
                <p class="question-preview-time">2 min ago</p>
                <div class="question-preview-price">+$2</div>
                <button class="btn question-preview-button">ANSWER</button>
              </div>
            </div>
          </div>
          <div class="element-box solved">
            <div class="element-content-wrapper">
              <div class="element-content">
                <p class="question-preview-class">CS 2800: Discrete Structures</p>
                <p class="question-preview-solve-time">~15 min solve time</p>
                <p class="question-preview-description">
                  How to I transition from a NFA to a DFA?
                </p>
              </div>
              <div class="question-preview-side">
                <p class="question-preview-time">Yesterday</p>
                <div class="question-preview-price">+$2.50</div>
                <button class="btn question-preview-button disabled">ANSWER</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <div class="container footer-section row-flex">
        <div class="footer-logo third left">
          <a class="brand" href="/">
            <img class="image" src="https://assets-global.website-files.com/663e9d09bf17aecd0f01533c/663e9dd579b2ea25fbccac21_graduation-cap-svgrepo-com.svg" alt="" width="67" />
          </a>
        </div>
        <div class="footer-link third center">&copy; Edify</div>
        <div class="footer-email third right"> Email us at: <a href="#"> info@edify.com </a>
        </div>
      </div>
    </div>
    </div>
  </body>
</html>
