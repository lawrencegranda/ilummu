
<table id="laderboard-table" class="table">
    <thead>
        <tr>
            {% for header in headings %}
            <th class="text-center heading">{{ header }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in data %}
        <tr>
            <td class="align-items-center">
                <div class="rank">
                    <h4 class="mb-0 text-center rank-text text_item_rank">{{ row[0] }}</h4>
                </div>
            </td>
            <td class="align-items-center">
                <h6 class="mb-0 text-center text_item_name">{{ row[1] }}</h5>
            </td>
            <td class="text-center text_item_grade">{{ row[2] }}</td>
            <td class="text-center text_item_points">{{ row[3] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
