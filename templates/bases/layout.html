<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <title>Edify: {% block title %}{% endblock %}</title>

        <!-- Styles -->
        {% include 'bases/headers.html' %}

    </head>


    <body>
        <!-- Navbar -->
        {% if logged %}
            {% include 'bases/navbar-logged.html' %}
        {% else %}
            {% include 'bases/navbar-not-logged.html' %}
        {% endif %}

        <!-- Content -->
        <div class="container main-content">
            {% block content %}
            {% endblock %}
        </div>

        <!-- Footer -->
        {% include 'bases/footer.html' %}

    </body>

</html>
