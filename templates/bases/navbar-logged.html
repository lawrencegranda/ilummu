<div class="navbar logged">
	<div class="container">
		<div class="navigation">
			<div class="navigation-left">
				<a class="brand" href="/dashboard">
					<img class="image brand-image" src="https://assets-global.website-files.com/663e9d09bf17aecd0f01533c/663e9dd579b2ea25fbccac21_graduation-cap-svgrepo-com.svg" alt=""/>
				</a>
				<div class="brand-name" onclick="location.href='/';"> Edify </div>
			</div>
			<div class="navigation-center">
				<input type="text" id="search-box" placeholder="Search for a question..." name="text" class="form-control" autocomplete="off">
			</div>
			<div class="navigation-right">
				<div class="navigation-button-wrap">
					<button type="button" id="notification" onclick="toggleNotificationCenter()">
						<img class="image bell" src="/static/bell.svg" alt="" />
					</button>
					<button class="btn btn-dark" type="button">Log Out</button>
				</div>
				<div id="notification-wrapper" style="display: none;">
					<div class="notification-center-dimensions notification-background"></div>
					<div class="notification-center-dimensions notification-wrapper">
						<div class="notification-center">
							<p class="notifications-title">Notifcations</p>
							{% for notification in notifications %}
							<div class="notification">
								<p class="notification-text">{{notification['message']}}</p>
								<button class="btn btn-view" type="button">view</button>
							</div>
							{% endfor %}
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<button class="btn add-button" type="button">
	<img class="plus-add" src="/static/plus.svg" alt=""/>
</button>
