name: Run Tests

on:
  push:
    branches: [main, master, DEV, PROD ]
  pull_request:
    branches: [main, master, DEV, PROD ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      
      - uses: actions/setup-python@v2
        with:
          python-version: '3.10.7'
          
      - name: Install dependencies
        run: poetry install
        
      - name: Start poetry
        run: poetry shell
        
      - name: Run tests
        run: pytest
        
