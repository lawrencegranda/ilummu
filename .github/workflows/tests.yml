name: Run Tests

on:
  push:
    branches: [main, master, DEV, PROD]
  pull_request:
    branches: [main, master, DEV, PROD]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Pull prebuilt Docker image
        run: docker pull lawrencegranda/pythonpoetry:3.10.7-1.7.1

      - name: Install dependencies
        run: |
          echo -e "\033[1;34mInstalling dependencies...\033[0m"
          docker run -it --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          lawrencegranda/pythonpoetry:3.10.7-1.7.1 \
          poetry install --no-interaction --no-root

      - name: Run tests
        run: |
          echo -e "\033[1;34mRunning tests...\033[0m"
          docker run -it --rm \
          -v ${{ github.workspace }}:/app \
          -w /app \
          lawrencegranda/pythonpoetry:3.10.7-1.7.1 \
          poetry run pytest || exit 1
